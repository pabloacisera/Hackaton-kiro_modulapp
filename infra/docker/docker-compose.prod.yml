# ──────────────────────────────────────────────────────────────────────────────
# docker-compose.prod.yml — Production deployment
# Builds images locally on the EC2 instance.
# All services behind Nginx reverse proxy on port 80.
# Cloudflare Tunnel handles HTTPS termination externally.
# ──────────────────────────────────────────────────────────────────────────────

services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-core:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      landing:
        condition: service_started
      admin-dashboard:
        condition: service_started
    restart: always
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  landing:
    build:
      context: ../..
      dockerfile: apps/landing/Dockerfile
    restart: always

  admin-dashboard:
    build:
      context: ../..
      dockerfile: apps/admin-dashboard/Dockerfile
    restart: always

  api-core:
    build:
      context: ../..
      dockerfile: apps/api-core/Dockerfile
    env_file: ../../.env
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PAYMENT_SERVICE_URL=http://payment-service:8081
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  payment-service:
    build:
      context: ../../apps/payment-service
      dockerfile: Dockerfile
    env_file: ../../.env
    environment:
      - SPRING_PROFILES_ACTIVE=production
    restart: always
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8081/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  redis-data:
