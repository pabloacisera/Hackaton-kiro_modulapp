# ─── Dev overlay for docker-compose.yml ──────────────────────────────────────
# Bind-mounts local source into every container and swaps the production
# command for the dev server, so file changes on the host reflect inside
# the container in real time.
#
# The Dockerfiles already have a `builder` stage that installs all deps
# (pnpm workspace / mvn dependency:go-offline). We target that stage so
# node_modules and ~/.m2 live inside the image, while source code comes
# from the host bind mount.
#
# node_modules paths are declared as anonymous volumes to shadow the host
# folders — otherwise the bind mount would hide the deps installed in the
# image. Same trick for /root/.m2 in payment-service.
#
# Usage:
#   docker compose -f infra/docker/docker-compose.yml \
#                  -f infra/docker/docker-compose.dev.yml up
# (`scripts/dev-up.sh` and the Makefile do this automatically.)

services:
  landing:
    build:
      target: builder
    working_dir: /app
    # Vite binds container port 80 so the parent compose `3000:80` mapping
    # and the reverse-proxy upstream (landing:80) keep working unchanged.
    # CHOKIDAR_USEPOLLING is required for HMR on Windows/WSL2 bind mounts.
    environment:
      VITE_PORT: '80'
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '500'
    command: sh -c "pnpm --filter @modula/landing dev"
    volumes:
      - ../..:/app
      - /app/node_modules
      - /app/apps/landing/node_modules
      - /app/apps/admin-dashboard/node_modules
      - /app/apps/api-core/node_modules
      - /app/packages/shared-types/node_modules

  admin-dashboard:
    build:
      target: builder
    working_dir: /app
    environment:
      VITE_PORT: '80'
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '500'
    command: sh -c "pnpm --filter @modula/admin-dashboard dev"
    volumes:
      - ../..:/app
      - /app/node_modules
      - /app/apps/landing/node_modules
      - /app/apps/admin-dashboard/node_modules
      - /app/apps/api-core/node_modules
      - /app/packages/shared-types/node_modules

  api-core:
    build:
      target: builder
    working_dir: /app
    # Windows/WSL2 bind mounts don't emit inotify events. Force chokidar
    # (the file watcher used by NestJS / Vite) to poll instead.
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '500'
    command: sh -c "pnpm --filter @modula/api-core dev"
    volumes:
      - ../..:/app
      - /app/node_modules
      - /app/apps/landing/node_modules
      - /app/apps/admin-dashboard/node_modules
      - /app/apps/api-core/node_modules
      - /app/packages/shared-types/node_modules

  payment-service:
    build:
      target: builder
    working_dir: /app
    # Reset ENTRYPOINT from the maven base image so `command` runs as-is.
    entrypoint: []
    # `mvn spring-boot:run` recompiles and launches on start. For live
    # reload of Java changes you need spring-boot-devtools + `mvn compile`
    # inside the container while the app is running.
    command: mvn spring-boot:run
    volumes:
      - ../../apps/payment-service:/app
      - payment-service-m2:/root/.m2

volumes:
  payment-service-m2:
