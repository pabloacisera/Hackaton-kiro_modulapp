services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-core:
        condition: service_healthy
      landing:
        condition: service_started
      admin-dashboard:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/health']
      interval: 10s
      timeout: 5s
      retries: 5

  landing:
    build:
      context: ../..
      dockerfile: apps/landing/Dockerfile
    ports:
      - '3000:80'
    restart: unless-stopped

  admin-dashboard:
    build:
      context: ../..
      dockerfile: apps/admin-dashboard/Dockerfile
      args:
        - VITE_API_URL=/api
    ports:
      - '3001:80'
    restart: unless-stopped

  api-core:
    build:
      context: ../..
      dockerfile: apps/api-core/Dockerfile
    ports:
      - '8080:8080'
    env_file: ../../.env
    environment:
      - NODE_ENV=development
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  payment-service:
    build:
      context: ../../apps/payment-service
      dockerfile: Dockerfile
    ports:
      - '8081:8081'
    env_file: ../../.env
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8081/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  redis-data:
