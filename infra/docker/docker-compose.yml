services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-core:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      landing:
        condition: service_started
      admin-dashboard:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  landing:
    build:
      context: ../../apps/landing
      dockerfile: Dockerfile
    expose:
      - "3000"
    restart: unless-stopped

  admin-dashboard:
    build:
      context: ../../apps/admin-dashboard
      dockerfile: Dockerfile
    expose:
      - "3001"
    restart: unless-stopped

  api-core:
    build:
      context: ../../apps/api-core
      dockerfile: Dockerfile
    expose:
      - "8080"
    env_file: ../../.env
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-service:
    build:
      context: ../../apps/payment-service
      dockerfile: Dockerfile
    expose:
      - "8081"
    env_file: ../../.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
