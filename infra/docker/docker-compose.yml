services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-core:
        condition: service_healthy
      landing:
        condition: service_started
      admin-dashboard:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/health']
      interval: 10s
      timeout: 5s
      retries: 5

  landing:
    build:
      context: ../..
      dockerfile: apps/landing/Dockerfile
    ports:
      - '3000:80'
    restart: unless-stopped

  admin-dashboard:
    build:
      context: ../..
      dockerfile: apps/admin-dashboard/Dockerfile
    ports:
      - '3001:80'
    restart: unless-stopped

  api-core:
    build:
      context: ../..
      dockerfile: apps/api-core/Dockerfile
    ports:
      - '8080:8080'
    env_file: ../../.env
    environment:
      # Override DATABASE_URL to add connection params needed by Prisma in Docker
      DATABASE_URL: postgresql://postgres:ModulaTest2024@database-modulapp.cp8qyc4u6dpy.us-east-2.rds.amazonaws.com:5432/postgres?sslmode=require&connect_timeout=10
      # BullMQ connects to the local redis container (not Upstash REST API)
      REDIS_HOST: redis
      # Unset UPSTASH_REDIS_URL so BullMQ uses local redis for job queues
      UPSTASH_REDIS_URL: ''
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/health']
      interval: 10s
      timeout: 5s
      retries: 5

  payment-service:
    build:
      context: ../../apps/payment-service
      dockerfile: Dockerfile
    ports:
      - '8081:8081'
    env_file: ../../.env
    environment:
      # Conexión directa a RDS
      PAYMENT_DB_HOST: database-modulapp.cp8qyc4u6dpy.us-east-2.rds.amazonaws.com
      PAYMENT_DB_PASSWORD: ModulaTest2024
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8081/health']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  redis-data:
