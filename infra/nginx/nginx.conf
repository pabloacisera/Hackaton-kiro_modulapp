events {
  worker_connections 1024;
}

http {
  # Límite máximo de body para uploads (imágenes, documentos, Excel)
  client_max_body_size 50m;

  upstream api {
    server api-core:8080;
  }

  upstream payments {
    server payment-service:8081;
  }

  upstream landing_upstream {
    server landing:80;
  }

  upstream admin_upstream {
    server admin-dashboard:80;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;

    # API Core endpoints + WebSocket (Socket.IO)
    location /api/ {
      proxy_pass http://api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_cache off;
    }

    # Socket.IO WebSocket — route to api-core
    location /socket.io/ {
      proxy_pass http://api/socket.io/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    # Health check (api-core)
    location /health {
      proxy_pass http://api/health;
    }

    # Payment service endpoints
    location /payments/ {
      proxy_pass http://payments/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Admin dashboard (served at /admin/)
    location /admin/ {
      proxy_pass http://admin_upstream/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    # Landing (default — everything else)
    location / {
      proxy_pass http://landing_upstream/;
      proxy_set_header Host $host;
    }

    # Error page for 413 (file too large)
    error_page 413 @413_json;
    location @413_json {
      default_type application/json;
      return 413 '{"statusCode":413,"message":"El archivo excede el tamaño máximo permitido (50 MB)","error":"Payload Too Large"}';
    }
  }
}
