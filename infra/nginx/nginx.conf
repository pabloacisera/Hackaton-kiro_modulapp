events {
  worker_connections 1024;
}

http {
  upstream api {
    server api-core:8080;
  }

  upstream payments {
    server payment-service:8081;
  }

  upstream landing_upstream {
    server landing:80;
  }

  upstream admin_upstream {
    server admin-dashboard:80;
  }

  server {
    listen 80;

    # API Core endpoints
    location /api/ {
      proxy_pass http://api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # Health check (api-core)
    location /health {
      proxy_pass http://api/health;
    }

    # Payment service endpoints
    location /payments/ {
      proxy_pass http://payments/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Admin dashboard (served at /admin/)
    location /admin/ {
      proxy_pass http://admin_upstream/;
      proxy_set_header Host $host;
    }

    # Landing (default — everything else)
    location / {
      proxy_pass http://landing_upstream/;
      proxy_set_header Host $host;
    }
  }
}
