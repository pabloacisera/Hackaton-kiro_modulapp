server:
  port: 8081

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://${PAYMENT_DB_HOST:database-modulapp.cp8qyc4u6dpy.us-east-2.rds.amazonaws.com}:5432/postgres
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: ${PAYMENT_DB_PASSWORD:ModulaTest2024}
    hikari:
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    url: jdbc:postgresql://${PAYMENT_DB_HOST:database-modulapp.cp8qyc4u6dpy.us-east-2.rds.amazonaws.com}:5432/postgres
    user: postgres
    password: ${PAYMENT_DB_PASSWORD:ModulaTest2024}
    locations: classpath:db/migration
    baseline-on-migrate: true

paypal:
  client-id: ${PAYPAL_CLIENT_ID:}
  client-secret: ${PAYPAL_CLIENT_SECRET:}
  mode: ${PAYPAL_MODE:sandbox}
  webhook-id: ${PAYPAL_WEBHOOK_ID:}
  app-public-url: ${APP_PUBLIC_URL:https://localhost}

mailjet:
  api-key: ${MAILJET_API_KEY:}
  api-secret: ${MAILJET_API_SECRET:}
  from-email: ${MAILJET_FROM_EMAIL:}
  from-name: ${MAILJET_FROM_NAME:}

supabase:
  url: ${SUPABASE_URL:}
  storage-bucket: ${SUPABASE_STORAGE_BUCKET:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}

api-core:
  webhook-url: ${API_CORE_WEBHOOK_URL:http://localhost:8080}
