server {
  listen 80;
  root /usr/share/nginx/html;
  include /etc/nginx/mime.types;

  # Serve assets under /admin/ prefix to match Vite base config
  location /admin/assets/ {
    alias /usr/share/nginx/html/assets/;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
